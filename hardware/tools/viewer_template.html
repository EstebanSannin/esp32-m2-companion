<title>ESP32 M.2 Companion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f1f3ef; --ink: #232a27; --muted: #66716b; --accent: #2e7d52;
  --chip: rgba(255,255,255,0.82); --chip-line: rgba(35,42,39,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181a; --ink: #e6eae6; --muted: #8b968f; --accent: #5cb388;
    --chip: rgba(24,28,30,0.82); --chip-line: rgba(230,234,230,0.14);
  }
}
:root[data-theme="dark"] {
  --bg: #15181a; --ink: #e6eae6; --muted: #8b968f; --accent: #5cb388;
  --chip: rgba(24,28,30,0.82); --chip-line: rgba(230,234,230,0.14);
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); overflow: hidden;
       font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
#c { width: 100vw; height: 100vh; display: block; touch-action: none; }
.chip { position: fixed; backdrop-filter: blur(8px); background: var(--chip);
        border: 1px solid var(--chip-line); border-radius: 10px; }
header.chip { top: 16px; left: 16px; padding: 12px 16px; max-width: 300px; }
header h1 { margin: 0 0 2px; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
header .rev { color: var(--accent); font-family: "IBM Plex Mono", ui-monospace, monospace;
              font-size: 11px; font-weight: 500; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 10px 0 0;
     font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; }
dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
footer.chip { bottom: 16px; left: 50%; transform: translateX(-50%);
              padding: 7px 14px; font-size: 11.5px; color: var(--muted);
              font-family: "IBM Plex Mono", ui-monospace, monospace; white-space: nowrap; }
#loading { position: fixed; inset: 0; display: grid; place-items: center;
           color: var(--muted); font-size: 13px; letter-spacing: 0.06em;
           text-transform: uppercase; }
</style>
<canvas id="c"></canvas>
<header class="chip">
  <h1>ESP32 M.2 Companion</h1>
  <div class="rev">pre-route placement &middot; GATE 3 pending</div>
  <dl>
    <dt>Form factor</dt><dd>M.2 Key-B 2242</dd>
    <dt>Board</dt><dd>22 &times; 42 &times; 0.8 mm, 4 layers</dd>
    <dt>MCU</dt><dd>ESP32-S3-WROOM-1-N8R2</dd>
    <dt>Top</dt><dd>module + 2x JST SH (vertical)</dd>
    <dt>Bottom</dt><dd>passives, ESD, TPs</dd>
  </dl>
</header>
<footer class="chip">drag&nbsp;rotate &middot; scroll&nbsp;zoom &middot; right-drag&nbsp;pan</footer>
<div id="loading">loading board&hellip;</div>
